[project]
name = "tao-harness"
version = "0.1.0"
description = "A minimal business-agent harness for lqzc, built around Ollama, FastAPI, tools, and SQLite."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "mcp>=1.26.0",
    "psycopg[binary]>=3.2.1",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.1",
    "uvicorn[standard]>=0.34.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tao_harness*"]
